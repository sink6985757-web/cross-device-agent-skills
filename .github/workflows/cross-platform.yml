name: cross-platform-source

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Configure disposable Git identity
        run: |
          git config --global user.name "Source CI"
          git config --global user.email "source-ci@example.invalid"
      - name: Cross-platform lifecycle
        run: |
          python tests/source.tests.py
          python tests/hub.tests.py
      - name: POSIX adapter
        if: runner.os != 'Windows'
        run: |
          sh -n source.sh
          sh -n source/scripts/install-unix-deps.sh
          ./source.sh --help
      - name: PowerShell adapter
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\source.tests.ps1
      - name: Diff hygiene
        run: git diff --check
